name: secret scan

# P-13: a secret scan on push. The allowlist in .gitleaks.toml carries the false positives
# that the pre-publish audit listed (C-2), scoped per file; everything else fails the run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
