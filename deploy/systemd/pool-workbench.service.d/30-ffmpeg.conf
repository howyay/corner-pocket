# Corner Pocket workbench on a pinned FFmpeg (docs/ffmpeg-pin.md).
# Installed as ~/.config/systemd/user/pool-workbench.service.d/30-ffmpeg.conf; the unit
# file itself is untouched.  Both paths are garbage-collection roots, so
# nix-collect-garbage cannot delete the build under the running service.
# Removing this drop-in (daemon-reload, restart) returns the resolver to PATH and to
# the unrooted /nix/store glob - which is exactly the fragility this pin removes.
[Service]
Environment=POOL_FFMPEG=%h/.local/state/pool/ffmpeg-bin/bin/ffmpeg
Environment=POOL_FFPROBE=%h/.local/state/pool/ffmpeg-bin/bin/ffprobe
