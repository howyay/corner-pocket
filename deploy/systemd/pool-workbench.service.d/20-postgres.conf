# Corner Pocket workbench on PostgreSQL (docs/postgres.md "Cutover runbook", step 4).
# Installed as ~/.config/systemd/user/pool-workbench.service.d/20-postgres.conf; the unit
# file itself is untouched. Removing this drop-in (daemon-reload, restart) returns the
# service to the JSON files - see the runbook's rollback.
[Unit]
Requires=pool-postgres.service
After=pool-postgres.service

[Service]
# POOL_DATABASE_URL (mode-600 file, never in the repository)
EnvironmentFile=%h/.config/pool/postgres.env
