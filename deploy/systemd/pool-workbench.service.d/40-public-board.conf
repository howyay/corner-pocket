# Corner Pocket public board (docs/public-board.md, "Deploy: the systemd drop-in").
# Installed as ~/.config/systemd/user/pool-workbench.service.d/40-public-board.conf; the
# unit file itself is untouched. Removing this drop-in (daemon-reload, restart) closes the
# public port again - see the runbook's rollback. Not installed by this repository: it is
# checked in for review only.
[Service]
# An ExecStart override must first clear the inherited list: systemd appends to it, and
# without this empty line the service would be started twice.
ExecStart=
ExecStart=/home/operator/projects/pool/.venv/bin/python /home/operator/projects/pool/annotator/unified_server.py --port 8130 --public-port 8132 --public-prefix /board
