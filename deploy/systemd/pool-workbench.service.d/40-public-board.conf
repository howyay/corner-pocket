# Corner Pocket public board (docs/public-board.md, "Deploy: the systemd drop-in").
# Installed as ~/.config/systemd/user/pool-workbench.service.d/40-public-board.conf; the
# unit file itself is untouched. Removing this drop-in (daemon-reload, restart) closes the
# public port again - see the runbook's rollback. Installed 2026-09-30; checked in so the
# deployed drop-in and this repository agree.
[Service]
# An ExecStart override must first clear the inherited list: systemd appends to it, and
# without this empty line the service would be started twice.
# The flag --port pins the port here. The owner of the default is the server:
# annotator/unified_server.py:2869 holds parser.add_argument("--port", type=int, default=8130).
# tests/test_unit_render.py compares the value on the next line with that default.
ExecStart=
ExecStart=%h/projects/pool/.venv/bin/python %h/projects/pool/annotator/unified_server.py --port 8130 --public-port 8132 --public-prefix /board
